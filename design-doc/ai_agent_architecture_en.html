<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decoupled Multi-Agent State Machine Architecture</title>
    <style>
        body { 
            background-color: #f6f8fa; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .diagram-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            padding: 30px;
            overflow-x: auto;
        }
        svg { 
            display: block; 
        }
        .title { font-size: 28px; font-weight: bold; fill: #24292f; }
        .subtitle { font-size: 16px; font-weight: normal; fill: #57606a; }
        .box-title { font-size: 18px; font-weight: bold; fill: #24292f; }
        .box-text { font-size: 14px; fill: #57606a; }
        .box-text-bold { font-size: 14px; font-weight: bold; fill: #24292f; }
        .arrow-text { font-size: 13px; font-weight: bold; fill: #0969da; }
        .arrow-text-alt { font-size: 13px; font-weight: bold; fill: #cf222e; }
        .sub-box-title { font-size: 14px; font-weight: bold; fill: #24292f; text-anchor: middle; }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg viewBox="0 0 1700 1150" width="100%" height="auto" style="min-width: 1200px;" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrow Markers -->
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
                </marker>
                <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
                </marker>

                <!-- Gradients -->
                <linearGradient id="gradOrange" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffe6cc"/><stop offset="100%" stop-color="#ffcc99"/>
                </linearGradient>
                <linearGradient id="gradYellow" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fff2cc"/><stop offset="100%" stop-color="#ffe699"/>
                </linearGradient>
                <linearGradient id="gradBlue" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#dae8fc"/><stop offset="100%" stop-color="#c4d6f0"/>
                </linearGradient>
                <linearGradient id="gradPurple" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#e1d5e7"/><stop offset="100%" stop-color="#d4c1eb"/>
                </linearGradient>
                <linearGradient id="gradGreen" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#d5e8d4"/><stop offset="100%" stop-color="#97d077"/>
                </linearGradient>
                <linearGradient id="gradCyan" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#e0f7fa"/><stop offset="100%" stop-color="#b2ebf2"/>
                </linearGradient>
                <linearGradient id="gradWhite" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f3f4f6"/>
                </linearGradient>
                
                <!-- Drop Shadow -->
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
                </filter>
            </defs>

            <!-- Title -->
            <text x="50" y="50" class="title">Decoupled Multi-Agent State Machine Architecture</text>
            <text x="50" y="80" class="subtitle">Review and Critique (Generator-Critic) Pattern with Strict Memory Isolation &amp; Checkpointing</text>

            <!-- Workspace Boundary Boxes -->
            <rect x="150" y="300" width="500" height="630" fill="rgba(218, 232, 252, 0.2)" stroke="#a1c4fd" stroke-width="2" stroke-dasharray="8 4" rx="10" />
            <text x="400" y="915" font-size="14" font-weight="bold" fill="#6ba5f2" text-anchor="middle">Generator Execution Environment</text>

            <rect x="1050" y="300" width="500" height="630" fill="rgba(225, 213, 231, 0.2)" stroke="#cbb2df" stroke-width="2" stroke-dasharray="8 4" rx="10" />
            <text x="1300" y="915" font-size="14" font-weight="bold" fill="#b18cd4" text-anchor="middle">Critique Execution Environment</text>

            <!-- MAIN COMPONENTS -->
            
            <!-- User Box -->
            <rect x="750" y="30" width="200" height="50" rx="8" fill="url(#gradWhite)" stroke="#d0d7de" stroke-width="2" filter="url(#shadow)" />
            <text x="850" y="60" class="box-title" text-anchor="middle">External Application / User</text>

            <!-- Orchestrator Box -->
            <rect x="600" y="130" width="500" height="150" rx="8" fill="url(#gradOrange)" stroke="#d79b00" stroke-width="2" filter="url(#shadow)" />
            <text x="850" y="165" class="box-title" text-anchor="middle">OrchestratorService (Parent Controller)</text>
            <text x="630" y="200" class="box-text-bold">• Pydantic State Schema</text>
            <text x="645" y="220" class="box-text">OrchestratorState (Iteration Counter, Draft History)</text>
            <text x="630" y="245" class="box-text-bold">• Conditional Routing Logic &amp; HITL Suspension</text>

            <!-- Generator State Filter -->
            <rect x="250" y="320" width="300" height="90" rx="8" fill="url(#gradYellow)" stroke="#d6b656" stroke-width="2" filter="url(#shadow)" />
            <text x="400" y="350" class="box-title" text-anchor="middle">State Filter (Isolation Barrier)</text>
            <text x="400" y="375" class="box-text" text-anchor="middle">Deep Copy &amp; Context Scrubbing</text>
            <text x="400" y="395" class="box-text" text-anchor="middle">Blocks all Critique logic &amp; traces</text>

            <!-- Critic State Filter -->
            <rect x="1150" y="320" width="300" height="90" rx="8" fill="url(#gradYellow)" stroke="#d6b656" stroke-width="2" filter="url(#shadow)" />
            <text x="1300" y="350" class="box-title" text-anchor="middle">State Filter (Isolation Barrier)</text>
            <text x="1300" y="375" class="box-text" text-anchor="middle">Deep Copy &amp; Context Scrubbing</text>
            <text x="1300" y="395" class="box-text" text-anchor="middle">Provides clean draft, hides Generator traces</text>

            <!-- Generator Subsystem -->
            <rect x="200" y="460" width="400" height="400" rx="8" fill="url(#gradBlue)" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow)" />
            <text x="400" y="495" class="box-title" text-anchor="middle">GeneratorAgentService</text>
            <text x="400" y="515" class="box-text" text-anchor="middle">Private AgentSession (LLM: Claude 3.7)</text>
            <text x="400" y="535" class="box-text" text-anchor="middle">Task: Research, Plan, and Create Candidate Draft</text>
            
            <!-- Generator ReAct Internals -->
            <rect x="230" y="560" width="150" height="60" rx="6" fill="#ffffff" stroke="#a1c4fd" stroke-width="2" />
            <text x="305" y="595" class="sub-box-title">Thought (Reasoning)</text>
            <rect x="420" y="560" width="150" height="60" rx="6" fill="#ffffff" stroke="#a1c4fd" stroke-width="2" />
            <text x="495" y="595" class="sub-box-title">Action (Read Docs)</text>
            <rect x="420" y="700" width="150" height="60" rx="6" fill="#ffffff" stroke="#a1c4fd" stroke-width="2" />
            <text x="495" y="735" class="sub-box-title">Observation</text>
            <rect x="230" y="700" width="150" height="60" rx="6" fill="#ffffff" stroke="#a1c4fd" stroke-width="2" />
            <text x="305" y="735" class="sub-box-title">Update Context</text>
            
            <text x="400" y="805" class="box-text-bold" text-anchor="middle">Extended Thinking (Budget Tokens)</text>
            <text x="400" y="835" class="box-text-bold" text-anchor="middle" fill="#0969da">Yields: Pure Candidate Draft (Text)</text>

            <!-- Critic Subsystem -->
            <rect x="1100" y="460" width="400" height="400" rx="8" fill="url(#gradPurple)" stroke="#9673a6" stroke-width="2" filter="url(#shadow)" />
            <text x="1300" y="495" class="box-title" text-anchor="middle">CritiqueAgentService</text>
            <text x="1300" y="515" class="box-text" text-anchor="middle">Private AgentSession (LLM: Claude 3.7)</text>
            <text x="1300" y="535" class="box-text" text-anchor="middle">Task: Fact-check, Verify, and Enforce Quality</text>

            <!-- Critic ReAct Internals -->
            <rect x="1130" y="560" width="150" height="60" rx="6" fill="#ffffff" stroke="#cbb2df" stroke-width="2" />
            <text x="1205" y="595" class="sub-box-title">Thought / Inspect</text>
            <rect x="1320" y="560" width="150" height="60" rx="6" fill="#ffffff" stroke="#cbb2df" stroke-width="2" />
            <text x="1395" y="595" class="sub-box-title">Cross-Reference Docs</text>
            <rect x="1320" y="700" width="150" height="60" rx="6" fill="#ffffff" stroke="#cbb2df" stroke-width="2" />
            <text x="1395" y="735" class="sub-box-title">Retrieve Past Errors</text>
            <rect x="1130" y="700" width="150" height="60" rx="6" fill="#ffffff" stroke="#cbb2df" stroke-width="2" />
            <text x="1205" y="735" class="sub-box-title">submit_critique()</text>

            <text x="1300" y="805" class="box-text-bold" text-anchor="middle">Mandatory Structured Tool Call</text>
            <text x="1300" y="835" class="box-text-bold" text-anchor="middle" fill="#0969da">Yields: CritiqueResult (Passed, Issues)</text>

            <!-- Persistence Layer -->
            <!-- Checkpointer -->
            <rect x="600" y="1000" width="500" height="120" rx="8" fill="url(#gradGreen)" stroke="#82b366" stroke-width="2" filter="url(#shadow)" />
            <text x="850" y="1035" class="box-title" text-anchor="middle">PostgreSQL Checkpointer</text>
            <text x="630" y="1065" class="box-text">• Persists OrchestratorState at every node transition</text>
            <text x="630" y="1085" class="box-text">• Enables Human-In-The-Loop (HITL) manual pause/resume</text>
            <text x="630" y="1105" class="box-text">• Guarantees system crash recovery</text>

            <!-- Vector DB -->
            <rect x="1150" y="1000" width="300" height="100" rx="8" fill="url(#gradCyan)" stroke="#00b4d8" stroke-width="2" filter="url(#shadow)" />
            <text x="1300" y="1035" class="box-title" text-anchor="middle">Vector Episodic Memory</text>
            <text x="1170" y="1065" class="box-text">• Embeds historical error patterns</text>
            <text x="1170" y="1085" class="box-text">• Provides consistent evaluation rubric</text>


            <!-- PATHS AND ROUTING LINES -->
            
            <!-- User to Supervisor -->
            <path d="M 850 80 V 130" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" />
            <text x="860" y="110" class="arrow-text">(1) Submit Task</text>

            <!-- Supervisor to User (Success) -->
            <path d="M 750 130 V 80" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" />
            <text x="630" y="110" class="arrow-text">Final Result (Passed)</text>

            <!-- Supervisor to Gen Filter -->
            <path d="M 600 205 H 408 A 8,8 0 0,0 400,213 V 320" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" />
            <text x="350" y="195" class="arrow-text">(2) Dispatch Task &amp; Revision Notes</text>

            <!-- Loop Back to Gen Filter (On Failure) -->
            <path d="M 600 240 H 328 A 8,8 0 0,0 320,248 V 320" fill="none" stroke="#cf222e" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-red)" stroke-linejoin="round" />
            <text x="340" y="232" class="arrow-text-alt">Loop Iteration: Inject Feedback</text>

            <!-- Gen Filter to Gen Subsystem -->
            <path d="M 400 410 V 460" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" />
            <text x="410" y="440" class="arrow-text">Task &amp; Notes ONLY</text>

            <!-- Gen ReAct Loop Internals -->
            <path d="M 380 590 H 410" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 495 620 V 690" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 420 730 H 390" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 305 700 V 620" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />

            <!-- Gen to Supervisor (Draft Status) -->
            <path d="M 600 750 H 892 A 8,8 0 0,0 900,742 V 280" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" stroke-dasharray="6 4" />
            <text x="620" y="740" class="arrow-text">(3) Return Candidate Draft to Orchestrator</text>

            <!-- Gen to Checkpointer -->
            <path d="M 600 820 H 742 A 8,8 0 0,1 750,828 V 1000" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" />
            <text x="760" y="880" class="arrow-text">(3) Update Checkpoint</text>

            <!-- Supervisor to Critic Filter -->
            <path d="M 1100 205 H 1292 A 8,8 0 0,1 1300,213 V 320" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" />
            <text x="1110" y="195" class="arrow-text">(4) Dispatch Task &amp; Pure Draft</text>

            <!-- Critic Filter to Critic Subsystem -->
            <path d="M 1300 410 V 460" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" />
            <text x="1310" y="440" class="arrow-text">Draft ONLY (No Traces)</text>

            <!-- Critic ReAct Loop Internals -->
            <path d="M 1280 590 H 1310" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 1395 620 V 690" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 1320 730 H 1290" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 1205 700 V 620" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />

            <!-- Critic to Vector DB -->
            <path d="M 1300 860 V 1000" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" />
            <text x="1310" y="900" class="arrow-text">(5) Log Error Patterns</text>
            
            <!-- Vector DB to Critic (Retrieve) -->
            <path d="M 1270 1000 V 860" fill="none" stroke="#00b4d8" stroke-width="2" marker-end="url(#arrow-blue)" stroke-linejoin="round" stroke-dasharray="4 4" />
            <text x="1160" y="930" class="arrow-text" style="fill:#00b4d8;">RAG Injection</text>

            <!-- Critic to Supervisor (Feedback Status) -->
            <path d="M 1500 660 H 1592 A 8,8 0 0,0 1600,652 V 248 A 8,8 0 0,0 1592,240 H 1100" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" stroke-dasharray="6 4" />
            <text x="1510" y="650" class="arrow-text">(6) Return Structured JSON</text>
            <text x="1510" y="670" class="arrow-text">CritiqueResult via Tool</text>

        </svg>
    </div>
</body>
</html>
