<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decoupled Multi-Agent State Machine Architecture</title>
    <style>
        body { 
            background-color: #f6f8fa; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .diagram-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            padding: 30px;
            overflow-x: auto;
        }
        svg { 
            display: block; 
        }
        .title { font-size: 28px; font-weight: bold; fill: #24292f; }
        .subtitle { font-size: 16px; font-weight: normal; fill: #57606a; }
        .box-title { font-size: 18px; font-weight: bold; fill: #24292f; }
        .box-text { font-size: 14px; fill: #57606a; }
        .box-text-bold { font-size: 14px; font-weight: bold; fill: #24292f; }
        .arrow-text { font-size: 13px; font-weight: bold; fill: #0969da; }
        .arrow-text-alt { font-size: 13px; font-weight: bold; fill: #cf222e; }
        .sub-box-title { font-size: 14px; font-weight: bold; fill: #24292f; text-anchor: middle; }
    </style>
</head>
<body>
    <div class="diagram-container">
        <svg width="1700" height="1100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrow Markers -->
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
                </marker>
                <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
                </marker>

                <!-- Gradients -->
                <linearGradient id="gradOrange" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffe6cc"/><stop offset="100%" stop-color="#ffcc99"/>
                </linearGradient>
                <linearGradient id="gradYellow" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fff2cc"/><stop offset="100%" stop-color="#ffe699"/>
                </linearGradient>
                <linearGradient id="gradBlue" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#dae8fc"/><stop offset="100%" stop-color="#c4d6f0"/>
                </linearGradient>
                <linearGradient id="gradPurple" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#e1d5e7"/><stop offset="100%" stop-color="#d4c1eb"/>
                </linearGradient>
                <linearGradient id="gradGreen" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#d5e8d4"/><stop offset="100%" stop-color="#97d077"/>
                </linearGradient>
                <linearGradient id="gradCyan" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#e0f7fa"/><stop offset="100%" stop-color="#b2ebf2"/>
                </linearGradient>
                <linearGradient id="gradWhite" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f3f4f6"/>
                </linearGradient>
                
                <!-- Drop Shadow -->
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
                </filter>
            </defs>

            <!-- Title -->
            <text x="50" y="50" class="title">Decoupled Multi-Agent State Machine Architecture</text>
            <text x="50" y="80" class="subtitle">Review and Critique (Generator-Critic) Pattern with Memory Isolation & Checkpointing</text>

            <!-- Background grouping boxes (optional, for visual boundaries) -->
            <rect x="150" y="300" width="500" height="580" fill="rgba(218, 232, 252, 0.2)" stroke="#a1c4fd" stroke-width="2" stroke-dasharray="8 4" rx="10" />
            <text x="400" y="860" font-size="14" font-weight="bold" fill="#6ba5f2" text-anchor="middle">Generator Workspace</text>

            <rect x="1050" y="300" width="500" height="580" fill="rgba(225, 213, 231, 0.2)" stroke="#cbb2df" stroke-width="2" stroke-dasharray="8 4" rx="10" />
            <text x="1300" y="860" font-size="14" font-weight="bold" fill="#b18cd4" text-anchor="middle">Critic Workspace</text>

            <!-- MAIN COMPONENTS -->
            
            <!-- User Box -->
            <rect x="750" y="30" width="200" height="50" rx="8" fill="url(#gradWhite)" stroke="#d0d7de" stroke-width="2" filter="url(#shadow)" />
            <text x="850" y="60" class="box-title" text-anchor="middle">External Application</text>

            <!-- Supervisor Box -->
            <rect x="600" y="130" width="500" height="140" rx="8" fill="url(#gradOrange)" stroke="#d79b00" stroke-width="2" filter="url(#shadow)" />
            <text x="850" y="165" class="box-title" text-anchor="middle">Parent Workflow / Supervisor Controller</text>
            <text x="630" y="200" class="box-text-bold">• Pydantic State Models</text>
            <text x="645" y="220" class="box-text">GlobalState (Loop Counter, Thread ID, Final Result)</text>
            <text x="630" y="245" class="box-text-bold">• Conditional Routing Logic</text>

            <!-- Generator State Filter -->
            <rect x="250" y="320" width="300" height="80" rx="8" fill="url(#gradYellow)" stroke="#d6b656" stroke-width="2" filter="url(#shadow)" />
            <text x="400" y="350" class="box-title" text-anchor="middle">State Filter (Barrier)</text>
            <text x="400" y="375" class="box-text" text-anchor="middle">Deep Copy & Schema Extraction</text>
            <text x="400" y="390" class="box-text" text-anchor="middle">Removes Critic's Internal Logic</text>

            <!-- Critic State Filter -->
            <rect x="1150" y="320" width="300" height="80" rx="8" fill="url(#gradYellow)" stroke="#d6b656" stroke-width="2" filter="url(#shadow)" />
            <text x="1300" y="350" class="box-title" text-anchor="middle">State Filter (Barrier)</text>
            <text x="1300" y="375" class="box-text" text-anchor="middle">Deep Copy & Schema Extraction</text>
            <text x="1300" y="390" class="box-text" text-anchor="middle">Extracts Pure Draft, Removes ReAct Traces</text>

            <!-- Generator Subsystem -->
            <rect x="200" y="450" width="400" height="380" rx="8" fill="url(#gradBlue)" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow)" />
            <text x="400" y="485" class="box-title" text-anchor="middle">Generator Subsystem</text>
            <text x="400" y="505" class="box-text" text-anchor="middle">Isolated ReAct Loop (Task: Create/Fix Output)</text>
            
            <!-- Generator ReAct Internals -->
            <rect x="230" y="550" width="150" height="60" rx="6" fill="#ffffff" stroke="#a1c4fd" stroke-width="2" />
            <text x="305" y="585" class="sub-box-title">Thought</text>
            <rect x="420" y="550" width="150" height="60" rx="6" fill="#ffffff" stroke="#a1c4fd" stroke-width="2" />
            <text x="495" y="585" class="sub-box-title">Action (Tool Call)</text>
            <rect x="420" y="700" width="150" height="60" rx="6" fill="#ffffff" stroke="#a1c4fd" stroke-width="2" />
            <text x="495" y="735" class="sub-box-title">Observation</text>
            <rect x="230" y="700" width="150" height="60" rx="6" fill="#ffffff" stroke="#a1c4fd" stroke-width="2" />
            <text x="305" y="735" class="sub-box-title">Update Context</text>
            
            <text x="400" y="805" class="box-text-bold" text-anchor="middle">Output: Candidate Draft (String/JSON)</text>

            <!-- Critic Subsystem -->
            <rect x="1100" y="450" width="400" height="380" rx="8" fill="url(#gradPurple)" stroke="#9673a6" stroke-width="2" filter="url(#shadow)" />
            <text x="1300" y="485" class="box-title" text-anchor="middle">Critic Subsystem</text>
            <text x="1300" y="505" class="box-text" text-anchor="middle">Isolated ReAct Loop (Task: Strict Evaluation)</text>

            <!-- Critic ReAct Internals -->
            <rect x="1130" y="550" width="150" height="60" rx="6" fill="#ffffff" stroke="#cbb2df" stroke-width="2" />
            <text x="1205" y="585" class="sub-box-title">Thought / Review</text>
            <rect x="1320" y="550" width="150" height="60" rx="6" fill="#ffffff" stroke="#cbb2df" stroke-width="2" />
            <text x="1395" y="585" class="sub-box-title">Check Rubric</text>
            <rect x="1320" y="700" width="150" height="60" rx="6" fill="#ffffff" stroke="#cbb2df" stroke-width="2" />
            <text x="1395" y="735" class="sub-box-title">Extract Evidence</text>
            <rect x="1130" y="700" width="150" height="60" rx="6" fill="#ffffff" stroke="#cbb2df" stroke-width="2" />
            <text x="1205" y="735" class="sub-box-title">Verify</text>

            <text x="1300" y="805" class="box-text-bold" text-anchor="middle">Output: JSON {Passed: bool, Issues: [...]}</text>

            <!-- Checkpointer -->
            <rect x="600" y="940" width="500" height="120" rx="8" fill="url(#gradGreen)" stroke="#82b366" stroke-width="2" filter="url(#shadow)" />
            <text x="850" y="975" class="box-title" text-anchor="middle">PostgreSQL Checkpointer</text>
            <text x="630" y="1005" class="box-text">• Stores Complete State Snapshots for every Edge</text>
            <text x="630" y="1025" class="box-text">• Enables Human-In-The-Loop (HITL) Pausing</text>
            <text x="630" y="1045" class="box-text">• Guarantees Crash Recovery & Resumability</text>

            <!-- Vector DB -->
            <rect x="1150" y="940" width="300" height="100" rx="8" fill="url(#gradCyan)" stroke="#00b4d8" stroke-width="2" filter="url(#shadow)" />
            <text x="1300" y="975" class="box-title" text-anchor="middle">Vector Episodic Memory</text>
            <text x="1170" y="1005" class="box-text">• Historical Errors & Reflections</text>
            <text x="1170" y="1025" class="box-text">• Semantic Similarity RAG</text>


            <!-- PATHS AND ROUTING LINES -->
            
            <!-- User to Supervisor -->
            <path d="M 850 80 L 850 120" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" />
            <text x="860" y="105" class="arrow-text">(1) Trigger Task</text>

            <!-- Supervisor to User (Success) -->
            <path d="M 750 130 L 750 90" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" />
            <text x="620" y="105" class="arrow-text">Final Result (Passed)</text>

            <!-- Supervisor to Gen Filter -->
            <path d="M 600 200 L 400 200 L 400 310" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" />
            <text x="410" y="190" class="arrow-text">(2) Dispatch Task &amp; Context</text>

            <!-- Loop Back to Gen Filter (On Failure) -->
            <path d="M 600 240 L 300 240 L 300 310" fill="none" stroke="#cf222e" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-red)" stroke-linejoin="round" />
            <text x="410" y="232" class="arrow-text-alt">Loop: Pass Critic Issues back</text>

            <!-- Gen Filter to Gen Subsystem -->
            <path d="M 400 400 L 400 440" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" />
            <text x="410" y="425" class="arrow-text">Isolated GeneratorContext</text>

            <!-- Gen ReAct Loop Internals -->
            <path d="M 380 580 L 410 580" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 495 610 L 495 690" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 420 730 L 390 730" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 305 700 L 305 620" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />

            <!-- Gen to Checkpointer -->
            <path d="M 600 640 L 700 640 L 700 930" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" />
            <text x="710" y="700" class="arrow-text">(3) Save Candidate Draft</text>

            <!-- Checkpointer to Supervisor (Draft Status) -->
            <path d="M 750 940 L 750 280" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-dasharray="6 4" />
            <text x="760" y="600" class="arrow-text">(4) Draft Ready Update</text>

            <!-- Supervisor to Critic Filter -->
            <path d="M 1100 200 L 1300 200 L 1300 310" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" />
            <text x="1110" y="190" class="arrow-text">(5) Dispatch Pure Draft &amp; Rubric</text>

            <!-- Critic Filter to Critic Subsystem -->
            <path d="M 1300 400 L 1300 440" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" />
            <text x="1310" y="425" class="arrow-text">Scrubbed CriticContext</text>

            <!-- Critic ReAct Loop Internals -->
            <path d="M 1280 580 L 1310 580" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 1395 610 L 1395 690" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 1320 730 L 1290 730" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />
            <path d="M 1205 700 L 1205 620" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-gray)" />

            <!-- Critic to Checkpointer -->
            <path d="M 1100 640 L 1000 640 L 1000 930" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-linejoin="round" />
            <text x="1010" y="700" class="arrow-text">(6) Save JSON Feedback (Issues/Pass)</text>

            <!-- Checkpointer to Supervisor (Feedback Status) -->
            <path d="M 950 940 L 950 280" fill="none" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)" stroke-dasharray="6 4" />
            <text x="960" y="600" class="arrow-text">(7) Feedback Ready Update</text>

            <!-- Vector DB to Critic Subsystem -->
            <path d="M 1300 940 L 1300 840" fill="none" stroke="#00b4d8" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="4 2" />
            <text x="1310" y="890" class="arrow-text" style="fill:#00b4d8;">Vector Retrieval</text>

        </svg>
    </div>
</body>
</html>
